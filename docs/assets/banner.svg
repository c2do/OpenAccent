  <text x="290" y="168" fill="#FFFFFF" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">OpenAccent</text>
  <text x="294" y="226" fill="#E0E7FF" font-family="Inter, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Arabic', 'Noto Sans Devanagari', Helvetica, Arial, sans-serif" font-size="30" font-weight="500">Hello · مرحبا · Hola · Olá · Bonjour · Hallo · नमस्ते · Merhaba</text>
