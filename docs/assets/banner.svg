<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="OpenAccent — Hello · مرحبا · Hola · Olá · Bonjour · Hallo · नमस्ते · Merhaba">
