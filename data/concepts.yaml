# Core concepts: the everyday meanings that give a dialect away.
# Every dialect fills these in (an entry sets `concept: <id>`), which makes dialects comparable
# and lets OpenAccent tell when a reply mixes dialects. Keep ids stable; add, don't rename.
#
# id: { en: English gloss, ar: Arabic gloss, category }

# Greetings and responses
hello:          { en: "hello", ar: "مرحبا", category: greetings }
how_are_you:    { en: "how are you?", ar: "كيف حالك؟", category: greetings }
fine:           { en: "fine, well", ar: "بخير", category: greetings }
thanks:         { en: "thank you", ar: "شكراً", category: greetings }
youre_welcome:  { en: "you're welcome", ar: "عفواً", category: greetings }
sorry:          { en: "sorry", ar: "آسف", category: greetings }
please:         { en: "please", ar: "من فضلك", category: greetings }
bye:            { en: "goodbye", ar: "مع السلامة", category: greetings }
yes:            { en: "yes", ar: "نعم", category: greetings }
no:             { en: "no", ar: "لا", category: greetings }
okay:           { en: "okay", ar: "حسناً", category: greetings }
maybe:          { en: "maybe", ar: "ربما", category: greetings }
whats_up:       { en: "what's up?", ar: "ما الأخبار؟", category: greetings }

