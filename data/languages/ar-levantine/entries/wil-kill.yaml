meanings:
  - en: also, too, as well
    examples:
      - text: "wəl-kəll « aussi », de même sens de kamǟn ou kamēn : ḍarba bass hiyye
          ḍarbəˈto wəl-kəll « il l’a frappé, mais elle le frappa aussi »."
        en: he hit her but she hit him too.
      - text: "wəl-kəll « aussi »: ṛā̊ḥ ᵊl-ḥmā̊ṛ wəl-kəll « l’âne est parti aussi ».
          L‘expression n‘est pas particulière à Qornet Chahouâne ou à Beit Chbâb
          (p. 288); elle est assez répandue."
        en: the donkey went too
