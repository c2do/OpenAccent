meanings:
  - en: vocative particle
    examples: []
    sensitive: []
  - en: accusative particle, used with pronominal suffixes to express English object
      pronouns, like me, him, etc.
    examples:
      - text: شو بدك ياني قول؟
        en: What do you want me to say?
      - text: رح فرجيك ياهن.
        en: I'll show them to you.
    sensitive: []
  - en: Takes the place of a subject pronoun after و (w, “and”) when coordinating
      multiple pronouns
    examples:
      - text: شو رأيك نروح أنا وياكي سوا؟
        en: What do you say you and I go together?
    sensitive: []
  - en: or
    examples:
      - text: يا ... يا
        en: either ... or
      - text: |-
          w ɥa ceffti, lemmin byeṣrak qas,
          ɥrafli çana l deçtu ya hewwi l daçni...
        en: >-
          And on my lips, when a glass cries out,

          “Tell me, am I the one that tasted him or is he the one that tasted
          me...”
    sensitive: []
