word: هيك
dialect: ar-levantine
type: word
spellings: []
romanized:
  - hayk
  - hēk
meanings:
  - en: so, thus, like so
    examples: []
  - en: this way (i.e., direction), that way (i.e., direction) (e.g., to look this
      or that way, i.e., in this or that direction)
    examples: []
  - en: this, that; used as a pronominal object of قال (ʔāl, “to say”), فكّر
      (fakkar, “to think”), and similar transitive verbs of expression, عِمِل
      (ʕimil, “to do”) and synonyms, and comparative مِن (min, “than”).
    examples:
      - text: ليه قلت هيك؟ ليه عملت هيك؟ فكرتك أحسن من هيك
        en: Why did you say that? Why did you do that? I thought you were better than
          this.
  - en: such; such kind, this kind of
    examples:
      - text: ما فيي إتحمل هيك حكي منك!
        en: I can’t stand this kind of talk from you!
concept: this
register: neutral
familiarity: common
