pronunciation:
  ipa: /ʃiː/
meanings:
  - en: thing
    examples:
      - text: هيدي اشيا كتير مهمة
        en: These are very important things.
  - en: something, anything
    examples:
      - text: بدك شي تاني يا حبيبتي؟
        en: Do you want anything else, honey?
      - text: بدي عطيك شي.
        en: I want to give you something.
  - en: some, any
    examples:
      - text: في شي مشكلة؟
        en: Is there any [kind of] problem?
      - text: رح يرجع شي يوم
        en: He’ll come back some day.
  - en: circa, about
    examples:
      - text: لازم تنطرلك شي عشرين دقيقه
        en: You have to wait for about twenty minutes.
