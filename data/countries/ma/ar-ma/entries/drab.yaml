word: ضرب
dialect: ar-ma
type: word
spellings: []
romanized:
  - ḍrab
pronunciation:
  ipa: /dˤrab/
part_of_speech: verb
meanings:
  - en: to hit, to strike, to beat
    examples:
      - text: ضرب راسه مع الحيط
        en: He hit his head against the wall.
      - text: ضربه خوه على دراعه
        en: His brother hit him on his arm.
  - en: to do or perform an action
    examples:
      - text: ضربها بجرية.
        en: He ran.
      - text: ضربها بنعسة.
        en: He slept
  - en: to travel a distance
    examples:
      - text: ضرب مسافة على رجليه
        en: He walked a long distance on foot.
  - en: to play an instrument
    examples:
      - text: هاد الكومنجي كيعرف يضرب الكمنجة
        en: This violonist knows how to play the violin.
register: casual
familiarity: common
