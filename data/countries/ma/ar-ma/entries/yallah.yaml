  ipa: /jalˤ.lˤaːh/
meanings:
  - en: just, just now, recently
    examples:
      - text: يالله شفت خوك غادي فالشارع.
        en: I just saw your brother walking on the street.
  - en: about to, almost, on the verge of
    examples:
      - text: يالله جينا نبداوا نلعبوا وهي تتفش الكورة.
        en: We were about to start playing when the ball deflated.
  - en: barely
    examples:
      - text: الصالير يالله كيكفيه باش يخلص الكرا و الماكلة د الشهر.
        en: The salary barely covers his monthly rent and food.
  - en: hurry up, come on
    examples:
      - text: يالله، راه خاصنا نمشيوا!
        en: Come on, We have to go!
