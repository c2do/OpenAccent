word: चलना
dialect: hi-in
type: word
spellings: []
romanized:
  - calnā
pronunciation:
  ipa: /t͡ʃəl.nɑː/
part_of_speech: verb
meanings:
  - en: to go, to move; to walk, stroll
    examples:
      - text: मैं दुकान चलके जाऊँगा।
        en: I will go to shop by walking.
  - en: to go, to move; to come
    examples:
      - text: तुम शाम को ज़रा देर के लिए मेरे घर तक चली चलना।
        en: In the evening, come over to my house for a little while.
  - en: to go, to move; to leave, depart, set out
    examples:
      - text: अब यहाँ से चलो।
        en: Let's leave from here now.
  - en: to go, to move; to be moved or played (in games)
