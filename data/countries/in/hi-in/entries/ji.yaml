word: जी
dialect: hi-in
type: word
spellings: []
romanized:
  - jī
pronunciation:
  ipa: /d͡ʒiː/
meanings:
  - en: an expression of assent; yes, true, very well
    examples:
      - text: जी साहब!
        en: Yes sir!
      - text: जी हाँ!
        en: Yes (formal)
  - en: an expression of enquiry; yes?, who is it?
    examples: []
  - en: heart, mind (in the figurative, not anatomical, sense)
    examples:
      - text: उसके प्रेम ने मेरा जी ललचाया।
        en: My heart was allured by their love.
      - text: एक विचार अभी मेरे जी में आया।
        en: A thought just came to my mind.
