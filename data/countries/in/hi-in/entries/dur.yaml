  ipa: /d̪uːɾ/
meanings:
  - en: distant, far
    examples:
      - text: आपका कार्यालय यहाँ से कितनी दूर है।
        en: How far is your office from here?
      - text: पृथ्वी से शनि बहुत दूर है।
