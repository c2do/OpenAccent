word: कड़ा
dialect: hi-in
type: word
spellings: []
romanized:
  - kaṛā
pronunciation:
  ipa: /kə.ɽɑː/
meanings:
  - en: hard, difficult
    examples:
      - text: इस बरस का प्रश्नपत्र बहुत कड़ा है।
        en: The question paper for this year is very hard.
  - en: tough, resilient
    examples:
      - text: यह कच्चा मांस बहुत कड़ा है।
        en: This uncooked meat is very tough.
  - en: stiff, inflexible
    examples:
      - text: कलफ़ से कपड़े आम तौर पर कड़े हो जाते हैं।
        en: Starch usually makes clothes stiff.
  - en: stern
    examples:
      - text: भूल करने के बाद, वह कड़ी फटकार प्राप्त किया।
        en: After making a mistake, he received a stern reprimand.
