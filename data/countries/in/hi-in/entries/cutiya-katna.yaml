  - cūtiyā kāṭnā
pronunciation:
  ipa: /t͡ʃuː.t̪ɪ.jɑː kɑːʈ.nɑː/
part_of_speech: verb
meanings:
  - en: Literally, “to slice someone's cunt”
    examples: []
  - en: "[with का (kā, + genitive)] to make a fool of; to trick, deceive or befool"
    examples:
      - text: लेकिन कुदरत को इतना होने के बावजूद भी चैन नहीं मिला । उसने मेरा चूतिया
          काटने के लिए एक त्योहार भी ला दिया । जिसे हम लोग हिन्दी में
          'शिक्षकदिवस' कहते हैं और English में 'Teacher's day' कहते हैं ।
        en: But nature wasn't satisfied with this much. She even made a festival to make
          a fool of me, which we call 'śikṣak-divas' in Hindi and 'Teacher's
          day' in English.
