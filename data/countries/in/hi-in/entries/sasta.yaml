          रुपए में ख़रीद लिया है […]

          unhẽ likhā thā ki ma͠ine bahut sastā samajh kar is samay ek gāmv sāṭh
          hazār rupae mẽ xarīd liyā hai […]
        en: They wrote to them saying that at this time I had bought a town for seven
          thousand rupees thinking it to be very cheap.
