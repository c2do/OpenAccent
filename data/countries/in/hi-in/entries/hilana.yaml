meanings:
  - en: to move, to make something move
    examples:
      - text: पुलिसवालों ने हड़तालियों को हिलाने कि कोशिश की।
        en: The policemen tried to move the strikers.
  - en: to shake, swing, move around
    examples:
      - text: तू खजूर के उस वृक्ष के तने को पकड़कर अपनी ओर हिला। तेरे ऊपर ताज़ा पकी-पकी
          खजूरें टपक पड़ेंगी
        en: having taken hold of the date-palm tree trunk shake it towards you. Over you
          fresh and ripe dates will drop
  - en: to masturbate
    examples:
      - text: हिलाके सो जा
        en: Jerk off and go to bed.
