pronunciation:
  ipa: /eɪ/
part_of_speech: intj
meanings:
  - en: Used as a tag question, to emphasise what goes before or to request that the
      listener express an opinion about what has been said.
    examples:
      - text: These hot dogs are pretty good, eh?
      - text: Well, what dost thou think then of seeing the world? Do ye wish to go
          round Cape Horn to see any more of it, eh? Can’t ye see the world
          where you stand?
