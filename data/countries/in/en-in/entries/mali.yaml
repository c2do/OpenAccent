meanings:
  - en: A member of a caste in South Asia whose traditional occupation is gardening;
      hence, any South Asian gardener.
    examples:
      - text: I sent down dhobies, sweepers, cooks, and mallees, last to dig trenches
          for burying the dead, when burning was not possible.
      - text: He found, as he expected, that the poor girl was crying. And, as always,
          an Indian close outside the window, a mali in this case, picking up
          sounds.
