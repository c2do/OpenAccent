pronunciation:
  ipa: /ˈbɑːbuː/
part_of_speech: noun
meanings:
  - en: A Hindu title of respect, equivalent to Mr., usually appended to the surname
      of a Hindu man.
    examples:
      - text: I could see Kana-babu’s sweet-shop at the end of their lane with absolute
          clarity.
  - en: an archetypical Indian bureaucrat, perceived as being corrupt, lazy or
      arrogant.
    examples:
      - text: BBMP doesn’t have any elected representatives right now. So a babu has
          floated this tender to benefit his favourite businessmen.
