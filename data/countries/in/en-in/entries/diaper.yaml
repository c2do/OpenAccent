meanings:
  - en: An absorbent garment worn around the crotch that retains the wearer's urine
      and feces, often worn by a baby or young child who is not yet toilet
      trained, by an adult who is incontinent (who wets the bed), or under
      extreme working conditions without access to a toilet; a nappy.
