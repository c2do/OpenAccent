    examples:
      - text: Damien est irresponsable. — Ouais ; ça lui jouera des tours.
        en: Damian is irresponsible. — Yeah; it will play tricks on him in the future.
    sensitive: []
  - en: whoo (expresses joy)
    examples:
      - text: Ouais, on a gagné !
        en: Whoo, we / they won!
