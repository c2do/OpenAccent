pronunciation:
  ipa: /ɹəʊl/
meanings:
  - en: To leave or begin a journey; sometimes with out.
    examples:
      - text: I want to get there early; let's roll.
    sensitive: []
  - en: To leave or begin a journey; sometimes with out.; To compete, especially
      with vigor.
    examples:
      - text: OK guys, we're only down by two points. Let's roll!
    sensitive: []
  - en: To leave or begin a journey; sometimes with out.; To walk, especially
      leisurely or idly; to stroll.
    examples:
      - text: Let's roll around town on foot and see the sights.
    sensitive: []
  - en: To behave in a certain way; to adopt a general disposition toward a
      situation.
    examples:
      - text: I was going to kick his ass, but he wasn't worth getting all worked up
          over; I don't roll like that.
      - text: '"This is how we roll in Spring Valley," one teen reportedly boasted.'
    sensitive: []
