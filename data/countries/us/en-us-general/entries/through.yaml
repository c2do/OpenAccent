meanings:
  - en: To (or up to) and including, with all intermediate values; to... inclusive;
      until the end of.
    examples:
      - text: from 1945 through 1991;  the numbers 1 through 9;  your membership is
          active through March 15, 2013
      - text: The plural is "oyesses", but "oyes" vied with "oyez" through about the
          first half of the nineteenth century.
  - en: Finished; complete.
    examples:
      - text: They were through with laying the subroof by noon.
