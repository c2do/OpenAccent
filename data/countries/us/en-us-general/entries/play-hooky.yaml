word: play hooky
dialect: en-us-general
type: phrase
spellings: []
romanized: []
part_of_speech: verb
meanings:
  - en: "To play truant; to avoid (informally: skip) school, work, or other duties
      (stay away from these without permission nor an excuse); to skive or to
      bunk off (UK);"
    examples:
      - text: Plenty of people played hooky from work to go see the movie on opening
          day.
      - text: Next time you play hooky, you might want to take off your school uniform.
