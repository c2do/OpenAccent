pronunciation:
  ipa: /tɹʌk/
meanings:
  - en: A heavier motor vehicle designed to carry goods or to pull a semi-trailer
      designed to carry goods; (in Malaysia/Singapore) a such vehicle with a
      closed or covered carriage.
    examples:
      - text: We rented a truck big enough to carry the whole load in one trip.
      - text: That's why driving truck became more than a job for many in the industry.
          Driving truck was a lifestyle.
    sensitive: []
  - en: To travel, to proceed.
    examples:
      - text: Instead, when relatives heard that the right ship had docked, they trucked
          over to Ellis Island and waited desperately by the Kissing Post.
      - text: In November 1978, Hay and Starratt trucked on down toward the Classic City
          in a VW Van (of course), following the Grateful Dead's tour […]
    sensitive: []
  - en: To persist, to endure.
    examples:
      - text: Keep on trucking!
      - text: “What's ol' Harrison up to these days, Larry?” Grandpa asked. “Oh, he's
          still trucking along,” Uncle Larry replied.
    sensitive: []
