meanings:
  - en: An outer garment that covers the body from the waist downwards, covering
      each leg separately, usually as far as the ankles; trousers.
    examples:
      - text: It's in the evening after dark when the blackleg miner creeps to work.
          With his moleskin pants and his dirty shirt, there goes the blackleg
          miner.
      - text: Look for pants with reinforced seats and knees and full-length side
          zippers that make it possible to put the pants on while you are
