pronunciation:
  ipa: /ˈkɹæpi/
part_of_speech: adj
meanings:
  - en: Of very poor quality; unpleasant; distasteful.
    examples:
      - text: That is such a crappy car.
      - text: The referee just made a really crappy call.
    sensitive:
      - vulgar
  - en: Bad, sick, or depressed.
    examples:
      - text: I'm feeling really crappy - I think I need some fresh air.
    sensitive:
      - vulgar
  - en: Covered in crap (faeces/feces).
    examples:
      - text: Put the crappy diapers in the brown pail and the wet ones in the yellow
          pail.
    sensitive:
      - vulgar
