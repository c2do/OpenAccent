  ipa: /sæs/
meanings:
  - en: Backtalk, cheek, sarcasm.
    examples:
      - text: Say—if you give me much more of your sass I'll take and bounce a rock
          off'n your head.
      - text: Looky here—mind how you talk to me; I’m a-standing about all I can stand
          now—so don’t gimme no sass.
    sensitive: []
  - en: To talk, to talk back.
    examples:
      - text: “But, good land! what did he want to sass back for? You see, it couldn’t
          do him no good, and it was just nuts for them.”
    sensitive: []
  - en: To speak insolently to.
    examples:
      - text: Don’t sass your teachers!
    sensitive: []
