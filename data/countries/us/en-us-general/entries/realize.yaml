word: realize
dialect: en-us-general
type: word
spellings: []
romanized: []
pronunciation:
  ipa: /ˈɹɪə.laɪz/
part_of_speech: verb
meanings:
  - en: To become aware of, understand, or appreciate (a fact or situation,
      especially something which has been true for some time).
    examples:
      - text: He realized that he had left his umbrella on the train.
      - text: She desperately yelled at her young daughter, frantic to make her realize
          what she had done.
  - en: To sense (something) strongly or vividly as if real.
    examples:
      - text: That any civilized human being in this nineteenth century should not be
          aware that the earth travelled round the sun appeared to be to me such
          an extraordinary fact that I could hardly realize it.
