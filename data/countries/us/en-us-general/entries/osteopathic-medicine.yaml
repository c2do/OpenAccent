meanings:
  - en: A form of scientific medicine whose present-day form scientifically and
      legally overlaps with non-osteopathic medical science and practice. It
      developed from origins in osteopathy but diverged therefrom during the
      20th century; today, an MD degree and a DO degree have professional
      parity.
