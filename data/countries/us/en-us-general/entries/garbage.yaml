pronunciation:
  ipa: /ˈɡɑː.bɪd͡ʒ/
meanings:
  - en: Food waste material of any kind.
    examples: []
  - en: Useless or disposable material; waste material of any kind.
    examples:
      - text: The garbage truck collects all residential municipal waste.
  - en: Specifically, waste material destined not to be reclaimed through recycling,
      composting, etc.
    examples:
      - text: Compost goes in the brown bin and is picked up Monday, recycling goes in
          blue bags and is picked up Wednesday, and garbage goes in black bags
          and is picked up Thursday.
      - text: Oh, don't put the empty milk jug in that bin—that one's for garbage.
  - en: A place or receptacle for waste material.
    examples:
      - text: He threw the newspaper into the garbage.
