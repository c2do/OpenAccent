      - text: "[…]So I wropped 'em up in a five dollar bill and tied 'em up and sent
          'em, and they ain't back yet.”"
  - en: A piece of paper money; a banknote.; One hundred dollars.
    examples:
      - text: There was no excuse, simply no excuse for not making four or five bills a
          week. A little initiative, that's all.
      - text: All we got from her was Stranahan's location, and barely that. A house in
          the bay, she said. A house with a windmill. Easiest five bills that
          woman ever made.
