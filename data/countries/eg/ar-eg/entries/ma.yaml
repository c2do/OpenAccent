word: ما
dialect: ar-eg
type: word
spellings: []
romanized:
  - ma
  - ma-
  - m-
pronunciation:
  ipa: /ma(ː)/
meanings:
  - en: what's the matter with, what's with (someone or something) (with لـ (li-))
    examples:
      - text: مالك
        en: what's with you?
  - en: what has it to do with (someone or something) (with لـ (li-))
    examples:
      - text: أنا مالي
        en: what has it to do with me?, what's my business in this?
      - text: وماله
        en: so what. taht's fine. (lit. what's with it)
  - en: what has (someone or something) it to do with (someone or something) (with
      لـ (li-))
    examples:
      - text: مالك ومال الولد
        en: what concern of yours is in he boy? (i.e. why don't you stop interfering
          with the boy?)
      - text: مالي ومال البنت
        en: what have I got to do with the girl?
  - en: that
    examples:
      - text: بعد ما السباق ابتدى
        en: After the race began.
      - text: لحد ما
        en: until
register: neutral
familiarity: common
