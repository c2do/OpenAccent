meanings:
  - en: to do; to make
    examples: []
  - en: to equal, make
    examples:
      - text: Sonunda Parti iki ile ikinin beş ettiğini anons eder, senin de buna
          inanman gerekir.
        en: In the end, the Party would announce that two and two makes five from now
          on, and you would have to believe it.
  - en: to leave somebody deprived of something
    examples:
      - text: |-
          Ümitlerim kırıldı, bitti,
          Hayallerim yıkıldı, gitti,
          Bu dert beni benden etti,
          Sevdim, sevdim, bak ne hâle geldim!
        en: |-
          My hopes were broken, lost,
          My dreams were dashed, gone,
          This pain deprived me of myself,
          I loved, I loved, look what I became!
