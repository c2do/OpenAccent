word: çalışmak
dialect: tr-tr
type: word
spellings: []
romanized: []
pronunciation:
  ipa: "[t͡ʃɑ.ɫɯʃ.ˈmɑk]"
part_of_speech: verb
meanings:
  - en: to work
    examples:
      - text: üç yıldır bu okulda çalışıyorum
        en: I have been working in this school for three years
  - en: to study (lessons)
    examples:
      - text: matematik çalışacağım/matematiğe çalışacağım
        en: I will study maths
      - text: logaritma çalıştım/logaritmaya çalıştım
        en: I studied logarithm
  - en: to try to
    examples:
      - text: İyi bir insan olmaya çalışıyorum.
        en: I'm trying to be a good person.
      - text: Çalışmaya çalışıyorum.
        en: I'm trying to study.
  - en: to work out, to hit
    examples:
      - text: Haftada kaç gün bacak çalışıyorsun?
        en: How many days a week do you work out your legs?
