pronunciation:
  ipa: /ɟiɾˈmec/
part_of_speech: verb
meanings:
  - en: to enter, to go in
    examples:
      - text: Odaya hızla girdim.
        en: I entered the room quickly.
      - text: Mermi küçük deliğe kolayca girdi.
        en: The bullet went in the tiny hole easily.
  - en: to go in for, to take
    examples:
      - text: sınava girmek
        en: to take an exam
  - en: (a season, time &c.) to arrive
    examples:
      - text: Akşam namazı vakti girdi.
        en: It is the time for the evening prayer.
