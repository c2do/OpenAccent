  ipa: /ˈøj.le/
meanings:
  - en: like that, similar to (something).
    examples:
      - text: Öyle bir şey demedim.
        en: I didn't say anything like that.
  - en: in that way
    examples:
      - text: Bize öyle öğrettiler.
        en: They (have) taught us in that way.
  - en: that much, so ... that
    examples:
      - text: Öyle sarhoş olsam ki bir daha uyanmasam.
        en: I wish I would be so drunk that I won't wake up again.
