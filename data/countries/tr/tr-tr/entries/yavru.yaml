pronunciation:
  ipa: /javˈɾu/
meanings:
  - en: young (of an animal)
    examples: []
  - en: baby, cub (young animal)
    examples:
      - text: Kedimiz Mırnav, o sene dört yavru yavrulamıştı.
        en: Our cat Mırnav gave birth to four kittens that year.
  - en: A child
    examples:
      - text: Hiç bir anne yavrusunu ateşe atar mı?
        en: Would a mother ever throw her child to the fire?
  - en: baby (used to refer to an attractive person, most often female)
    examples:
      - text: Gel buraya güzelim, yavruların yavrusu!
        en: Come here my beauty, [sexy] baby!
