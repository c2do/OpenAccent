word: können
dialect: de-de
type: word
spellings: []
romanized: []
pronunciation:
  ipa: /ˈkœnən/
part_of_speech: verb
meanings:
  - en: to be able (to do or be something), to have the possibility of, can.; to be
      possible, to make sense
    examples:
      - text: Nächstes Jahr is’n Schaltjahr. – Das kann nich’. Letztes Jahr war doch
          Schaltjahr!
        en: Next year is a leap year. – That’s not possible. Last year was a leap year!
    sensitive: []
  - en: to be to blame, to be at fault
    examples:
      - text: Ich kann nichts dafür, dass das passiert ist.
        en: It's not my fault that happened.
      - text: Er kann nicht wirklich etwas für das Verhalten seiner Familie.
        en: He's not really to blame for his family's behavior.
    sensitive: []
register: casual
