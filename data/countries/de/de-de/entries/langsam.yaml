meanings:
  - en: it's getting to the point where; just about; used to indicate that an event
      or evaluation may not have fully come about yet, but is approaching that
      point.
    examples:
      - text: Wir werden uns langsam auf den Weg machen.
        en: We're about to head out. / We'll be leaving.
      - text: Ich habe langsam genug von den ganzen Streitereien.
        en: I've just about had it with all the bickering.
