word: so
dialect: de-de
type: word
spellings: []
romanized: []
pronunciation:
  ipa: /zoː/
meanings:
  - en: roughly, about (according to one's own estimation/memory)
    examples:
      - text: Das Teil müsste so 10 cm lang sein.
        en: The part should be about 10 cm long.
  - en: expletive; sometimes intensifying, sometimes with no noticeable meaning
    examples:
      - text: Wir sind runtergegangen und haben uns hier so hingesetzt.
        en: We went downstairs and, like, sat down here.
  - en: quotative particle, somewhat similar to be like but also combinable with
      other verbs
    examples:
      - text: 'Ich so: "Mach mal dalli!", und er dann so: "Ich bin ja schon dabei!"'
        en: I was like, "Hurry up!" and he was like, "I'm already on it!"
      - text: 'Ich dachte mir nur so: "Ja komm, lass stecken."'
        en: All I thought to myself [at that moment] was, "Yeah whatever, forget about
          it."
  - en: generalizing particle, combines with question words to ask to be given a
      broad idea, typically by way of some examples
    examples:
      - text: Was liest du so?
        en: What sort of things do you read? (Give me a handful of titles)
      - text: Wie ist es da so?
        en: What's it like there? (Tell me of your typical experience)
register: casual
familiarity: common
