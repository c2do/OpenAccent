pronunciation:
  ipa: /ʊntərˈveːks/
part_of_speech: adv
meanings:
  - en: out, not there
    examples:
      - text: Ist der Peter zu Hause? — Nee, der ist unterwegs.
        en: Is Peter home? — No, he’s out. (Does not imply he is on his way back.)
  - en: Used with some adverb, describing a general state.
    examples:
      - text: Der Typ ist cool unterwegs.
        en: He’s a cool guy.
      - text: Ich bin heut gut mit Kleingeld unterwegs.
        en: I have a lot of small change on me today.
