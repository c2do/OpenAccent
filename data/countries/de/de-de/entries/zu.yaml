  - en: shut, closed (made inaccessible or impassable; not open)
    examples:
      - text: Das Geschäft war zu.
        en: The shop was closed.
      - text: Die Tür muss aus Brandschutzgründen immer zu sein.
        en: This door must be shut at all times for reasons of fire safety.
