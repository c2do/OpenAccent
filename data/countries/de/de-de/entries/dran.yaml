part_of_speech: adv
meanings:
  - en: to be someone's turn (in a game, to do household chores, etc.)
    examples:
      - text: Du bist dran!
        en: It's your turn!
      - text: Wer ist heute mit dem Putzen dran?
        en: Whose turn is it to do the cleaning today?
  - en: to get it, to suffer consequences, punishment or retaliation
    examples:
      - text: Jetzt bist du dran!
        en: Now you're gonna get it!
