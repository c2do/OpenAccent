meanings:
  - en: to switch on, to turn on (a lamp, a stove, an electronic device, etc.)
    examples:
      - text: Könnt ihr bitte eure Kamera anmachen?
        en: Could you all please turn on your camera?
    sensitive: []
  - en: to start something with (someone), to provoke (someone), to accost,
      (Internet) to flame (approach aggressively)
    examples:
      - text: Die Nachbarn haben nichts gerafft / Und fühlten sich gleich angemacht
