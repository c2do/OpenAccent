word: auf
dialect: de-de
type: word
spellings: []
romanized: []
pronunciation:
  ipa: /aʊ̯f/
meanings:
  - en: Introduces a word, usually an adjective, acting as context or a condition
      for the whole sentence.
    examples:
      - text: auf süß
        en: all sweet, all nicely
      - text: auf lock
        en: casually
  - en: open
    examples:
      - text: Die Tür ist auf.
        en: The door is open.
  - en: finished; gone (food)
    examples:
      - text: Hast du deine Suppe auf?
        en: Have you finished your soup?
      - text: Die Milch is’ auf.
        en: The milk is gone. (consumed)
  - en: up; awake; out of bed
    examples:
      - text: Ich war um sechs Uhr auf.
        en: I was up at six o'clock.
register: casual
familiarity: common
