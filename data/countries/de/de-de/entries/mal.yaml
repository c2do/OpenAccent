  - en: Softening a sentence, thus making a request or command more polite, making
      an assertion more casual. By extension, indicating a command or request.
    examples:
      - text: Haben Sie mal Feuer?
        en: Do you have a lighter [please]?
      - text: Haste Feuer?
        en: D'ya have a lighter?
