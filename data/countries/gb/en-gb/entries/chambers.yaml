meanings:
  - en: Originally, a set of rooms at an Inn of Court used by one or more barristers
      as an office and residence; now, the office of one or more barristers in
      any building.
    examples:
      - text: "[B]e you mannerly to her, becauſe you are to pretend only to be her
          Squire, to arm her to her Lavvyers Chambers; but I vvill be impudent
          and baudy, for ſhe muſt love and marry me."
      - text: "[…] I dismissed my coach at the gate, and tripped it down to my counsel's
          chambers; for lawyer's fees take up too much of a small disputed
          jointure to admit any other expenses but mere necessaries."
