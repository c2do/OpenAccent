pronunciation:
  ipa: /ˈdaʊ̯n/
meanings:
  - en: Away from Oxford or Cambridge.
    examples:
      - text: He's gone back down to Newcastle for Christmas.
  - en: At (a given place that is seen as removed from one's present location or
      other point of reference).
    examples:
      - text: I'll see you later down the pub.
  - en: To (a given place that is seen as removed from one's present location or
      other point of reference).
    examples:
      - text: I'm going down the shops.
  - en: A tract of poor, sandy, undulating or hilly land near the sea, covered with
      fine turf which serves chiefly for the grazing of sheep.
    examples:
      - text: Seven thousand broad-taild Sheepe gras'd on his Downes;
