meanings:
  - en: "Often in the form Rouse and preceded by the: the sounding of a call,
      usually on the bugle in the morning after reveille, to signal that
      soldiers are to rise from bed; also, the reveille."
    examples:
      - text: The ‘rouse’ sounded at 2.45 a.m., and by four o’clock tents had been
          struck, baggage loaded up, and everything was ready for a start.
