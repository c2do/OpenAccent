meanings:
  - en: used to indicate doubt or uncertainty of something said, where English uses
      the sentence’s auxiliary verb followed by a pronoun
    examples:
      - text: “João se casará com ela.” “Será?”
        en: “John will marry her.” “Will he?”
      - text: “Eu serei escolhido.” “Será?”
